[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schwartz-mcp"
version = "0.3.0"
description = "Private, source-grounded campaign workflows over MCP"
requires-python = ">=3.11"
dependencies = ["mcp[cli]==2.3.0", "jsonschema>=4.23", "pydantic>=2.10"]

[project.scripts]
schwartz-mcp = "schwartz_mcp.server:main"
schwartz = "schwartz_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schwartz_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
